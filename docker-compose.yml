services:
  postgres:
    image: postgres:16-alpine
    container_name: procuev-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: procuev
    ports:
      - "5433:5432"  # host 5433 — avoids clashing with a local PostgreSQL service on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
