# Render blueprint: deploys the full app (client + server) as one Docker service.
# Set DATABASE_URL (Neon Postgres) and GEMINI_API_KEY in the Render dashboard.
services:
  - type: web
    name: procuev-speech-to-text
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: STT_PROVIDER
        value: gemini
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
